name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # El deploy (#3) corre el CI entero antes de publicar
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    # Los tests corren contra PostgreSQL (el mismo major que producción): crean y borran bases
    # minierp_test_* con este rol (TEST_DATABASE_URL, ver test/helpers/pg-admin.ts)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: minierp
          POSTGRES_PASSWORD: minierp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minierp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://minierp:minierp@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7

      # pg_dump y pg_restore (test/backup.test.ts) del mismo major que el servidor, como en producción
      # (postgresql-client-16): el runner trae los de PostgreSQL 17, que escriben
      # `SET transaction_timeout`, y un servidor 16 no lo conoce. /usr/bin/pg_dump es el wrapper de
      # Debian, que elige el major más nuevo instalado: por eso va su carpeta primero en el PATH.
      - name: Cliente de PostgreSQL 16
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/16/bin/pg_dump --version

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # e2e (#9): el mini-erp sirve la copia local del POS publicado (la baja solo al arrancar)
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      # Si falla el e2e, o si un test pasó recién al reintentar (queda su trace.zip), sube la traza
      - uses: actions/upload-artifact@v7
        if: failure() || hashFiles('test-results/**/trace.zip') != ''
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
