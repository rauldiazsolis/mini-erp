name: Deploy

# #3: por tag v* o a mano. Corre el CI entero y después despliega en Lightsail por SSH
# (guía en deploy/README.md; secretos y PUBLIC_HOST en el environment production).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # #40: la versión publicada es siempre la de package.json; un tag distinto frena todo antes del CI
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - id: release
        run: node scripts/check-release.ts

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: [version, ci]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # El origen del POS al que lleva "Probar la demo" (#11, #38): la variable POS_URL del environment;
      # vacía, https://pos.contax.ar (el link suma el canal, /v4/)
      - run: pnpm build
        env:
          VITE_POS_URL: ${{ vars.POS_URL }}

      - name: Armar la versión
        run: tar -czf release.tar.gz dist src scripts deploy package.json pnpm-lock.yaml contract.json

      - name: Llave SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Subir y activar
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          scp -i ~/.ssh/id_deploy release.tar.gz "$SSH_USER@$SSH_HOST:/opt/mini-erp/releases/$GITHUB_SHA.tar.gz"
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" \
            "set -e; R=/opt/mini-erp/releases/$GITHUB_SHA; rm -rf \$R; mkdir -p \$R; tar -xzf \$R.tar.gz -C \$R; bash \$R/deploy/deploy.sh $GITHUB_SHA"

      # Que la versión que responde sea la que se acaba de subir (si deploy.sh volvió a la anterior,
      # /health responde igual, pero con otra versión)
      - name: Chequeo público
        env:
          PUBLIC_HOST: ${{ vars.PUBLIC_HOST }}
          EXPECTED_VERSION: ${{ needs.version.outputs.version }}
        run: |
          body=$(curl -fsS --retry 5 --retry-delay 3 "https://$PUBLIC_HOST/health")
          echo "$body"
          deployed=$(printf '%s' "$body" | jq -r '.version // empty')
          if [ "$deployed" != "$EXPECTED_VERSION" ]; then
            echo "::error::Responde la versión ${deployed:-desconocida} y se esperaba $EXPECTED_VERSION"
            exit 1
          fi
